[project]
name = "ntt-vibekit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "anthropic>=0.40.0",
    "ruff>=0.9.0",
    "pytest>=8.0.0",
]

[project.scripts]
vibekit = "vibekit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling]
path = "vibekit"
